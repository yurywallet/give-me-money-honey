name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Auto-discovers every tests/test_*.py - never hand-list files here
      # (engineering-foundations §1: a hand-maintained list silently stops
      # covering new files as the project grows).
      - run: pytest -q
